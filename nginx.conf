worker_processes auto;

events {
    worker_connections 1024;
}

http {
    upstream api {
        server 127.0.0.1:5000;
    }

    upstream frontend {
        server 127.0.0.1:3000;
    }

    # Transport-layer headroom over UploadLimits.MaxFileSizeBytes (10 MB) — see
    # src/Anything.Core/Upload/UploadLimits.cs for why. Keep in sync with
    # UploadLimits.MaxRequestBodyBytes and Program.cs's Kestrel config.
    client_max_body_size 12m;

    server {
        listen 80;

        # Security headers, applied to every response (API and frontend alike).
        # `always` also attaches them to error responses (4xx/5xx), not just 2xx.
        # TLS terminates in front of this container (CapRover's edge proxy), but
        # HSTS is still correct to set here: the browser only honors it on the
        # response to the HTTPS connection it actually made, which is the
        # client-to-CapRover hop — this internal HTTP hop is irrelevant to that.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location /api/ {
            proxy_pass http://api;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /swagger {
            proxy_pass http://api;
            proxy_set_header Host $host;
        }

        location /health {
            proxy_pass http://api;
        }

        location /alive {
            proxy_pass http://api;
        }

        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
