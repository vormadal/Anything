version: 2
updates:
  # .NET dependencies
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
    open-pull-requests-limit: 10
    labels: []
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      efcore:
        patterns:
          - "Microsoft.EntityFrameworkCore*"
      aspire:
        patterns:
          - "Aspire.Hosting*"
          - "CommunityToolkit.Aspire*"
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
          - "Microsoft.AspNetCore.*"

  # Frontend dependencies
  - package-ecosystem: "npm"
    directory: "/anything-frontend"
    schedule:
      interval: "monthly"
      time: "09:00"
    open-pull-requests-limit: 10
    labels: []
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      jest:
        patterns:
          - "jest"
          - "jest-*"
          - "@types/jest"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
    open-pull-requests-limit: 5
    labels: []
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"
