name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g caprover
      - name: Deploy to CapRover
        run: >
          caprover deploy
          -b main
          -h https://captain.caprover.vormadal.com
          -a anything
          --appToken ${{ secrets.CAPROVER_APP_TOKEN }}
      - name: Verify deploy
        env:
          APP_NAME: anything
          CAPROVER_PASSWORD: ${{ secrets.CAPROVER_PASSWORD }}
        run: node .github/scripts/verify-deploy.js
