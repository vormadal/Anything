name: Deploy

on:
  push:
    branches: [main]

# Deploys must not be cancelled mid-flight (could leave CapRover in a partial
# state), so queue overlapping runs instead of aborting the in-progress one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy-e2e:
    runs-on: ubuntu-latest
    environment: E2E
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g caprover
      - name: Deploy to CapRover (e2e)
        run: >
          caprover deploy
          -b main
          -h https://captain.caprover.vormadal.com
          -a anything-e2e
          --appToken ${{ secrets.CAPROVER_E2E_APP_TOKEN }}
      - name: Verify e2e deploy
        uses: ./.github/actions/verify-caprover-deploy
        with:
          app-name: anything-e2e
          caprover-password: ${{ secrets.CAPROVER_PASSWORD }}

  e2e-tests:
    runs-on: ubuntu-latest
    needs: deploy-e2e
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ./anything-frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: anything-frontend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e tests
        run: npm run test:e2e
        env:
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          # In the deployed environment the API is served at the same origin as the
          # frontend (nginx proxies /api/ to the backend), so the API URL equals the
          # frontend base URL.
          E2E_API_URL: ${{ secrets.E2E_BASE_URL }}
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: anything-frontend/playwright-report/
      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v5
        with:
          path: anything-frontend/playwright-report/

  deploy-report:
    runs-on: ubuntu-latest
    needs: e2e-tests
    if: always()
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Playwright report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  deploy-production:
    runs-on: ubuntu-latest
    needs: e2e-tests
    environment: Production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install -g caprover
      - name: Deploy to CapRover (production)
        run: >
          caprover deploy
          -b main
          -h https://captain.caprover.vormadal.com
          -a anything
          --appToken ${{ secrets.CAPROVER_APP_TOKEN }}
      - name: Verify production deploy
        uses: ./.github/actions/verify-caprover-deploy
        with:
          app-name: anything
          caprover-password: ${{ secrets.CAPROVER_PASSWORD }}
