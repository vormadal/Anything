name: Update Visual Snapshots

on:
  push:
    branches-ignore: [main]
    paths:
      - 'anything-frontend/e2e/visual.spec.ts'
      - 'anything-frontend/e2e/fixtures/**'
      - 'anything-frontend/e2e/pages/**'
      - 'anything-frontend/src/**'
      - 'anything-frontend/public/**'
      - 'anything-frontend/playwright.visual.config.ts'
      - 'anything-frontend/next.config.*'
      - 'anything-frontend/tailwind.config.*'
      - '.github/workflows/update-visual-snapshots.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  update-snapshots:
    name: Regenerate Visual Snapshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.actor != 'github-actions[bot]'
    permissions:
      contents: write

    defaults:
      run:
        working-directory: ./anything-frontend

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: anything-frontend/package-lock.json

    - name: Install dependencies
      run: npm ci --ignore-scripts

    - name: Build Next.js application
      run: npm run build
      env:
        NEXT_PUBLIC_API_URL: http://localhost:5238

    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium

    - name: Update visual snapshots
      run: npm run test:e2e:visual:update

    - name: Commit updated snapshots
      working-directory: ${{ github.workspace }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add anything-frontend/e2e/visual.spec.ts-snapshots/
        if git diff --staged --quiet; then
          echo "No snapshot changes to commit"
        else
          git commit -m "chore: update visual snapshots [skip ci]"
          git push origin HEAD:${{ github.ref_name }}
        fi
